<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이동 중… · IEUM</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    // 옛 프로젝트 페이지 경로 "/seesaw/..." 를 벗겨내고 새 도메인으로 전달
    var rest = location.pathname.replace(/^\/seesaw/, "");
    if (rest === "" ) rest = "/";
    location.replace("https://i-eum.org" + rest + location.search + location.hash);
  })();
</script>
</head>
<body>
<p>이 페이지는 <a href="https://i-eum.org/">i-eum.org</a> 로 이전되었습니다. 잠시 후 자동으로 이동합니다.</p>
</body>
</html>
